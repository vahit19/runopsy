[project]
name = "runopsy-server"
version = "0.1.8"
description = "Local read-mostly HTTP API over a Runopsy store"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vahit Feryad", email = "vahit.feryat@gmail.com" }]
keywords = ["agent", "observability", "api", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "runopsy-core==0.1.8",
    "runopsy-collector==0.1.8",
    "runopsy-replay==0.1.8",
    "runopsy-cli==0.1.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/vahit19/runopsy"
Repository = "https://github.com/vahit19/runopsy"
Issues = "https://github.com/vahit19/runopsy/issues"
Changelog = "https://github.com/vahit19/runopsy/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runopsy_server"]
# The built web view, when it exists. It is produced by `npm run build` in
# packages/runopsy-ui immediately before packaging and is not in version control, so
# installing this wheel gives a working UI without a Node toolchain — while a source
# checkout that never ran the build still serves the plain index instead.
artifacts = ["src/runopsy_server/static/**"]
