[project]
name = "runopsy-cli"
version = "0.1.0"
description = "The Runopsy command line: diagnose agent runs and inspect the evidence"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vahit Feryad", email = "vahit.feryat@gmail.com" }]
dependencies = [
    "runopsy-core",
    "runopsy-collector",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
runopsy = "runopsy_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runopsy_cli"]
