[project]
name = "runopsy-cli"
version = "0.1.3"
description = "The Runopsy command line: diagnose agent runs and inspect the evidence"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vahit Feryad", email = "vahit.feryat@gmail.com" }]
keywords = ["agent", "debugging", "root-cause-analysis", "cli", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "runopsy-core==0.1.3",
    "runopsy-collector==0.1.3",
    "runopsy-bench==0.1.3",
    "runopsy-replay==0.1.3",
    "runopsy-adapter==0.1.3",
    "runopsy-semantic==0.1.3",
    "typer>=0.12",
    "rich>=13.7",
    # Transitive through typer, pinned here because 8.3.2 and below carry
    # PYSEC-2026-2132: command injection in click.edit(). Runopsy never calls it,
    # but shipping a known-vulnerable dependency means every user's own audit
    # reports it, and "we do not use that function" is not a fix.
    "click>=8.3.3",
]

[project.scripts]
runopsy = "runopsy_cli.main:cli"

[project.urls]
Homepage = "https://github.com/vahit19/runopsy"
Repository = "https://github.com/vahit19/runopsy"
Issues = "https://github.com/vahit19/runopsy/issues"
Changelog = "https://github.com/vahit19/runopsy/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runopsy_cli"]
