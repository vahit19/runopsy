[project]
name = "runopsy-semantic"
version = "0.1.0"
description = "Optional, budget-bounded semantic analysis for Runopsy diagnoses"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vahit Feryad", email = "vahit.feryat@gmail.com" }]
dependencies = [
    "runopsy-core",
    "runopsy-adapter",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runopsy_semantic"]
