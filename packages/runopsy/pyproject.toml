[project]
name = "runopsy"
version = "0.1.7"
description = "Find where an AI agent run started going wrong, not just where it stopped"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vahit Feryad", email = "vahit.feryat@gmail.com" }]
keywords = ["agent", "debugging", "root-cause-analysis", "observability", "llm", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

# What `pip install runopsy` should mean: the whole local product, working offline,
# with no provider key. The CLI pulls core, collector, replay, adapter and bench; the
# server carries the web view. Anything that needs a network or a heavy optional
# dependency stays behind an extra.
dependencies = [
    "runopsy-cli==0.1.7",
    "runopsy-server==0.1.7",
]

[project.optional-dependencies]
# Reading Inspect AI eval logs. Separate because inspect-ai is a large dependency
# that most users of the CLI will never touch.
inspect = ["runopsy-inspect==0.1.7"]
# The supported coding agent, so `pip install runopsy[hermes]` is one command instead of
# two. Deliberately an extra and never a hard dependency: Runopsy analyses a normalized
# trace and must not require any particular runtime to exist, which is the same rule that
# makes a second adapter possible. Unpinned because Hermes is somebody else's release
# schedule; the adapter is verified against 0.19.0.
hermes = ["hermes-agent"]
all = ["runopsy-inspect==0.1.7", "hermes-agent"]

[project.urls]
Homepage = "https://github.com/vahit19/runopsy"
Repository = "https://github.com/vahit19/runopsy"
Issues = "https://github.com/vahit19/runopsy/issues"
Changelog = "https://github.com/vahit19/runopsy/blob/main/CHANGELOG.md"
Documentation = "https://github.com/vahit19/runopsy/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runopsy"]
