[project]
name = "runopsy-replay"
version = "0.1.0"
description = "Checkpoint and fork replay planning for Runopsy, with side-effect gating"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vahit Feryad", email = "vahit.feryat@gmail.com" }]
dependencies = [
    "runopsy-core",
    "runopsy-adapter",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runopsy_replay"]
