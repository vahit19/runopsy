[project]
name = "runopsy-inspect"
version = "0.1.3"
description = "Read Inspect AI eval logs into Runopsy traces"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vahit Feryad", email = "vahit.feryat@gmail.com" }]
keywords = ["agent", "inspect-ai", "evaluation", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "runopsy-core==0.1.3",
    "runopsy-adapter==0.1.3",
    "runopsy-collector==0.1.3",
    "typer>=0.12",
    # Upper bound deliberate. inspect-ai 0.3.240 and later cap click below 8.2.2, which
    # is inside the range carrying PYSEC-2026-2132 (command injection in click.edit()).
    # Given a choice between the newest eval-log reader and a dependency with no known
    # command-injection hole, this takes the latter. 0.3.145 exposes the same
    # inspect_ai.event API this adapter reads. Revisit when upstream relaxes its pin.
    "inspect-ai>=0.3.145,<0.3.240",
]

[project.scripts]
runopsy-inspect = "runopsy_inspect.cli:main"

[project.urls]
Homepage = "https://github.com/vahit19/runopsy"
Repository = "https://github.com/vahit19/runopsy"
Issues = "https://github.com/vahit19/runopsy/issues"
Changelog = "https://github.com/vahit19/runopsy/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runopsy_inspect"]
