[project]
name = "runopsy-inspect"
version = "0.1.0"
description = "Read Inspect AI eval logs into Runopsy traces"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vahit Feryad", email = "vahit.feryat@gmail.com" }]
dependencies = [
    "runopsy-core",
    "runopsy-adapter",
    "runopsy-collector",
    "typer>=0.12",
    "inspect-ai>=0.3.100",
]

[project.scripts]
runopsy-inspect = "runopsy_inspect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runopsy_inspect"]
