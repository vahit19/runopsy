[project]
name = "runopsy-core"
version = "0.1.3"
description = "Framework-agnostic trace schema, graph, detectors and causal ranking for Runopsy"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vahit Feryad", email = "vahit.feryat@gmail.com" }]
keywords = ["agent", "observability", "root-cause-analysis", "llm", "tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.8",
]

[project.urls]
Homepage = "https://github.com/vahit19/runopsy"
Repository = "https://github.com/vahit19/runopsy"
Issues = "https://github.com/vahit19/runopsy/issues"
Changelog = "https://github.com/vahit19/runopsy/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runopsy_core"]
