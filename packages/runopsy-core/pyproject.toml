[project]
name = "runopsy-core"
version = "0.1.0"
description = "Framework-agnostic trace schema, graph, detectors and causal ranking for Runopsy"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vahit Feryad" }]
keywords = ["agent", "observability", "root-cause-analysis", "llm", "tracing"]
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runopsy_core"]
