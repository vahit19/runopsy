[project]
name = "runopsy-collector"
version = "0.1.0"
description = "Append-only local ingest and queryable storage for Runopsy traces"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vahit Feryad" }]
dependencies = [
    "runopsy-core",
    "duckdb>=1.1",
    "orjson>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runopsy_collector"]
