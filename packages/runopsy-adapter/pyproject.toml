[project]
name = "runopsy-adapter"
version = "0.1.0"
description = "Runtime adapter toolkit for Runopsy: recorder, secret scanner and contract"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Vahit Feryad", email = "vahit.feryat@gmail.com" }]
dependencies = [
    "runopsy-core",
    # Reading Hermes' own config to report whether it is wired to us.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runopsy_adapter"]
