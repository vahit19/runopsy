name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: full gate before anything is published
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
      # A release must not move the numbers without recording them.
      - run: uv run runopsy bench --write benchmarks/baseline-report.md
      - run: git diff --exit-code benchmarks/baseline-report.md

  build:
    name: build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Version must match the tag
        # A wheel whose version disagrees with the tag that produced it is unrepairable
        # once published: the index keeps the file forever.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version' packages/runopsy-cli/pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "$declared" ]; then
            echo "tag $tag does not match runopsy-cli version $declared" >&2
            exit 1
          fi

      # The wheel carries the built web view, so `pip install runopsy-server` gives a
      # working UI without a Node toolchain on the user's machine. The build output is
      # not committed; it is produced here, immediately before packaging.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/runopsy-ui/package-lock.json

      - name: Build the web view into the server package
        run: npm ci && npm run build
        working-directory: packages/runopsy-ui

      - name: Build every package
        run: |
          for package in packages/*/; do
            # runopsy-ui is a Node package; it ships inside runopsy-server, not as a wheel.
            [ -f "$package/pyproject.toml" ] || continue
            uv build "$package" --out-dir dist
          done

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: publish ${{ matrix.package }}
    needs: build
    runs-on: ubuntu-latest
    # Only a tag publishes. A manual run builds and verifies without releasing, so the
    # pipeline can be exercised without spending a version number.
    if: startsWith(github.ref, 'refs/tags/v')

    # One job per distribution, each from its own environment.
    #
    # This is not ceremony. PyPI identifies a pending trusted publisher by the triple
    # (repository, workflow, environment), so ten distributions publishing from one
    # environment collide: registering the second is refused with "a pending trusted
    # publisher matching this configuration has already been registered". Giving each
    # package an environment of its own makes each registration distinct, which is what
    # PyPI's model is asking for.
    #
    # It buys something real too: `pypi-runopsy` can carry a required reviewer without
    # every other package needing one.
    strategy:
      fail-fast: false
      matrix:
        package:
          - runopsy
          - runopsy-core
          - runopsy-collector
          - runopsy-adapter
          - runopsy-replay
          - runopsy-semantic
          - runopsy-bench
          - runopsy-cli
          - runopsy-server
          - runopsy-inspect
    environment: pypi-${{ matrix.package }}
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Keep only this package's files
        # The underscore form is what a wheel is named; the trailing dash stops
        # `runopsy` from matching `runopsy-core`, which would publish it ten times.
        run: |
          mkdir -p upload
          prefix="$(echo '${{ matrix.package }}' | tr '-' '_')-"
          for file in dist/*; do
            case "$(basename "$file")" in
              "$prefix"*) mv "$file" upload/ ;;
            esac
          done
          ls -1 upload
          test -n "$(ls -A upload)" || { echo "no distribution for ${{ matrix.package }}" >&2; exit 1; }

      # Trusted publishing: no long-lived token in repository secrets to leak.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/
