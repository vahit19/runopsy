name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a dependency becomes vulnerable on its own schedule rather than
    # on ours. A tool that handles credentials and runs subprocesses should not learn
    # about an advisory from a user.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Known vulnerabilities in dependencies
        # Audits the resolved third-party set. Workspace members are excluded because
        # they are not published, and --strict would otherwise fail on "not found on
        # PyPI" — turning a real vulnerability gate into noise everyone ignores.
        run: |
          uv export --format requirements-txt --no-hashes --no-dev \
            --no-emit-workspace > audit-requirements.txt
          uv run pip-audit --strict --desc -r audit-requirements.txt

      - name: Static analysis
        # Skips B101 (assert) since the test suite is built on it, and B404/B603 where
        # subprocess use is the shell adapter's entire purpose and is documented at the
        # call site.
        run: uv run bandit -c pyproject.toml -r packages -q

      - name: Software bill of materials
        # Required before any release: section 13.4 of the design document makes an SBOM
        # and a licence scan a precondition, since Hermes being MIT says nothing about
        # what a transitive dependency permits.
        run: |
          uv run cyclonedx-py requirements audit-requirements.txt \
            --output-format json --output-reproducible --output-file sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
