name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing here needs a provider key. If a test ever starts requiring one, it has
  # broken the promise that core analysis works offline, and CI should be the place
  # that notices.
  RUNOPSY_CI: "1"

jobs:
  quality:
    name: lint, types and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three, because the shell adapter runs real subprocesses and path
        # handling differs enough between platforms to have already caused one bug.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        # Every package is named explicitly rather than globbed, because the shells
        # differ across this matrix and an unexpanded glob would make mypy check
        # nothing while still exiting zero. Adding a package means adding it here.
        run: uv run mypy packages/runopsy-core/src packages/runopsy-collector/src
             packages/runopsy-cli/src packages/runopsy-bench/src
             packages/runopsy-replay/src packages/runopsy-adapter/src
             packages/runopsy-semantic/src packages/runopsy-server/src
             packages/runopsy-inspect/src packages/runopsy/src tests

      - name: Test
        run: uv run coverage run -m pytest

      - name: Coverage
        run: uv run coverage report

  web:
    name: web UI types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/runopsy-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/runopsy-ui/package-lock.json

      - run: npm ci

      # Strict TypeScript is the only check this package has; there is no test suite
      # here yet, and a view that fails to compile is a view nobody can open.
      - run: npm run typecheck

      - run: npm run build

  benchmark:
    name: localization benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Score the engine
        run: uv run runopsy bench --compare

      - name: Report must be current
        # The report carries no timestamp, so regenerating it produces identical bytes
        # unless the engine's behaviour actually changed. A diff here means someone
        # moved the numbers without recording it.
        run: |
          uv run runopsy bench --write benchmarks/baseline-report.md
          git diff --exit-code benchmarks/baseline-report.md

  build:
    name: packages build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build every package
        run: |
          for package in packages/*/; do
            # runopsy-ui is a Node package and ships inside runopsy-server, not as a wheel.
            [ -f "$package/pyproject.toml" ] || continue
            echo "::group::$package"
            uv build "$package" --out-dir dist
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          retention-days: 7
