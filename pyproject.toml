[project]
name = "runopsy-workspace"
version = "0.0.0"
description = "Runopsy monorepo root"
requires-python = ">=3.12"
dependencies = [
    "runopsy-core",
    "runopsy-collector",
    "runopsy-cli",
    "runopsy-bench",
    "runopsy-replay",
    "runopsy-adapter",
    "runopsy-semantic",
    "runopsy-server",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
runopsy-core = { workspace = true }
runopsy-collector = { workspace = true }
runopsy-cli = { workspace = true }
runopsy-bench = { workspace = true }
runopsy-replay = { workspace = true }
runopsy-adapter = { workspace = true }
runopsy-semantic = { workspace = true }
runopsy-server = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "coverage>=7.6",
    "mypy>=1.11",
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "cyclonedx-bom>=4.4",
    # Only the tests need it — to parse the Hermes config block we generate and prove it
    # is valid YAML. It already arrives transitively, but a test that depends on someone
    # else's dependency breaks the day that dependency changes.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/runopsy-core/src", "packages/runopsy-collector/src", "packages/runopsy-cli/src", "packages/runopsy-bench/src", "packages/runopsy-replay/src", "packages/runopsy-adapter/src", "packages/runopsy-semantic/src", "packages/runopsy-server/src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "DTZ",      # naive datetime use
    "PT",       # pytest style
    "RET",      # return simplification
    "SIM",      # simplification
    "PTH",      # pathlib over os.path
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Depends() in a default argument is how FastAPI declares dependencies; the rule that
# flags it predates that framework and has no way to tell it apart from a real bug.
"packages/runopsy-server/src/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/runopsy-core/src:packages/runopsy-collector/src:packages/runopsy-cli/src:packages/runopsy-bench/src:packages/runopsy-replay/src:packages/runopsy-adapter/src:packages/runopsy-semantic/src:packages/runopsy-server/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = [
    "runopsy_core",
    "runopsy_collector",
    "runopsy_cli",
    "runopsy_bench",
    "runopsy_replay",
    "runopsy_adapter",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = [
    # The test suite is built on assert.
    "B101",
    # Running subprocesses is the shell adapter's entire purpose; the call site
    # documents that the command comes from the user, not from a model.
    "B404",
    "B602",
    "B603",
]
